[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "djembe"
version = "0.3.0.dev0"
description = "Generative modelling of Malian jembe micro-timing with the symmetries of the metric cycle"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Clément Dumeril" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
# Graph model (Colab or local): PyTorch, PyTorch Geometric, Weights & Biases.
train = ["torch>=2.3", "torch-geometric>=2.5", "wandb>=0.17"]
dev = ["pytest>=8", "pre-commit>=3"]
# Audio rendering with the recorded samples in assets/samples (MP3 decoding needs libsndfile >= 1.1).
audio = ["soundfile>=0.12"]

[tool.setuptools]
packages = ["djembe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
